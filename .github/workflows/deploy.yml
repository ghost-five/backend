# Сборка образа и выкладка на ВМ. Запускается на main и руками.
name: deploy

on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: выложить на ВМ
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/ghost-five
            # Новый образ фиксируем в .env, чтобы откат был сменой одной строки.
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}|" .env
            docker compose pull api
            docker compose run --rm migrate
            docker compose up -d api
            # Ждём, пока сервер отзовётся: иначе выкладка «прошла», а сайт лежит.
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' ghost-five-api-1)" = "healthy" ]; then
                echo "сервер здоров"; exit 0
              fi
              sleep 2
            done
            echo "сервер не поднялся, откатываюсь"; docker compose logs --tail=50 api; exit 1
