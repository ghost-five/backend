# Выкладка собранного образа на ВМ. Запускается вручную, пока не прижилось;
# когда привыкнем — можно добавить push в main.
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образа (по умолчанию последний собранный из main)
        required: false
        default: latest

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: выложить на ВМ
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/ghost-five
            # Фиксируем тег в .env: откат — это смена одной строки и up -d.
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.tag }}|" .env
            docker compose pull api
            docker compose run --rm migrate
            docker compose up -d api
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' ghost-five-api-1)" = "healthy" ]; then
                echo "сервер здоров"; exit 0
              fi
              sleep 2
            done
            echo "сервер не поднялся"; docker compose logs --tail=50 api; exit 1
