# Проверки на каждый коммит и каждый pull request.
name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghost
          POSTGRES_PASSWORD: ghost
          POSTGRES_DB: ghost_five_test
        options: >-
          --health-cmd "pg_isready -U ghost" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://ghost:ghost@localhost:5432/ghost_five_test?sslmode=disable
      GF_FIXTURES: ${{ github.workspace }}/_frontend/fixtures/cases
    steps:
      - uses: actions/checkout@v5

      # Золотые тесты правил лежат во frontend, рядом с движком на JS. Репозиторий
      # публичный, токен не нужен. Каталог с «_» go и линтер не видят.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/frontend
          path: _frontend

      # Версию Go меняем вместе с go.mod и Dockerfile.
      - uses: actions/setup-go@v6
        with: { go-version: '1.27' }

      # Тот же образ dbmate, что применяет миграции на ВМ.
      - name: миграции применяются и откатываются
        run: |
          dbmate() {
            docker run --rm --network host -e DATABASE_URL \
              -v "$PWD/migrations:/db/migrations:ro" ghcr.io/amacneil/dbmate:2 --no-dump-schema "$@"
          }
          dbmate up
          dbmate rollback
          dbmate up

      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.15 }

      - name: тесты
        run: go test -race ./...
